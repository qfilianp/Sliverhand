<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240">
  <!-- Body -->
  <ellipse cx="100" cy="130" rx="70" ry="85" fill="#D4A914" stroke="#3d3d1f" stroke-width="4"/>
  
  <!-- Arms/Wings -->
  <ellipse cx="35" cy="110" rx="25" ry="50" fill="#D4A914" stroke="#3d3d1f" stroke-width="4"/>
  <ellipse cx="165" cy="110" rx="25" ry="50" fill="#8B7500" stroke="#3d3d1f" stroke-width="4"/>
  
  <!-- Bottom tail -->
  <path d="M 75 210 Q 100 230 125 210" fill="#8B7500" stroke="#3d3d1f" stroke-width="4"/>
  
  <!-- Left Eye White -->
  <ellipse cx="70" cy="70" rx="28" ry="35" fill="#E8E8E8" stroke="#3d3d1f" stroke-width="3"/>
  
  <!-- Right Eye White -->
  <ellipse cx="130" cy="70" rx="28" ry="35" fill="#E8E8E8" stroke="#3d3d1f" stroke-width="3"/>
  
  <!-- Left Pupil -->
  <ellipse cx="70" cy="75" rx="18" ry="25" fill="#000000"/>
  
  <!-- Right Pupil -->
  <ellipse cx="130" cy="75" rx="18" ry="25" fill="#000000"/>
  
  <!-- Mouth outline -->
  <path d="M 80 130 Q 100 155 120 130" fill="#000000" stroke="#3d3d1f" stroke-width="3"/>
  
  <!-- Tongue -->
  <ellipse cx="100" cy="160" rx="20" ry="25" fill="#FF6B6B"/>
  
  <!-- Tongue highlight -->
  <ellipse cx="95" cy="155" rx="8" ry="10" fill="#FFFFFF" opacity="0.6"/>
  
  <!-- Smile/teeth line -->
  <path d="M 85 135 Q 100 140 115 135" stroke="#FFFFFF" stroke-width="2" fill="none"/>
</svg>