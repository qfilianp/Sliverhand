<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Filly's SWF Player</title>
    <!-- Browser Tab Icon (using emoji) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75'>🎬</text></svg>">
    <style>
        body { background: #222; color: #fff; font-family: sans-serif; text-align: center; padding-top: 30px; }
        #player-container { width: 800px; height: 600px; margin: 20px auto; background: #000; border: 2px solid #444; display: flex; align-items: center; justify-content: center; }
        
        /* Loading spinner styles */
        .spinner {
            border: 4px solid #444;
            border-top: 4px solid #fff;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .loading-text {
            margin-top: 20px;
            font-size: 16px;
            color: #aaa;
        }
    </style>
</head>
<body>

    <h1>🎬 Ruffle SWF Player</h1>
    <p>Select your <strong>SWF</strong> file:</p>
    <input type="file" id="swf-file" accept=".swf">
    
    <div id="player-container"></div>

    <!-- Include Ruffle script -->
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
    <script>
        document.getElementById('swf-file').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (!file) return;

            // Create a local blob URL for the chosen file
            const fileURL = URL.createObjectURL(file);

            const container = document.getElementById('player-container');
            
            // Show loading spinner
            container.innerHTML = '<div><div class="spinner"></div><div class="loading-text">Loading SWF...</div></div>';

            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            
            player.style.width = '100%';
            player.style.height = '100%';

            // Load the local blob URL into Ruffle
            player.load({
                url: fileURL,
                backgroundColor: '#000',
                autoplay: 'on'
            });

            // Replace loading spinner with player once ready
            player.onEvent('runtime', (e) => {
                container.innerHTML = '';
                container.appendChild(player);
            });
        });
    </script>
</body>
</html>
