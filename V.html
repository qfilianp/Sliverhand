<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Filly's SWF Player</title>
    <!-- Browser Tab Icon (using custom monster icon) -->
    <link rel="icon" type="image/jpeg" href="icon.jpg">
    <style>
        body { background: #222; color: #fff; font-family: sans-serif; text-align: center; padding-top: 30px; }
        #player-container { width: 800px; height: 600px; margin: 20px auto; background: #000; border: 2px solid #444; display: flex; align-items: center; justify-content: center; position: relative; }
        
        /* Loading icon styles */
        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .loading-icon {
            width: 120px;
            height: 120px;
            animation: bounce 1s ease-in-out infinite;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        
        .loading-text {
            margin-top: 20px;
            font-size: 16px;
            color: #aaa;
        }
        
        /* Play button styles */
        .play-button {
            position: absolute;
            width: 100px;
            height: 100px;
            background: rgba(255, 255, 255, 0.2);
            border: 3px solid #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 50px;
            color: #fff;
            transition: all 0.3s ease;
            z-index: 10;
        }
        
        .play-button:hover {
            background: rgba(255, 255, 255, 0.4);
            transform: scale(1.1);
        }
        
        .play-button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <h1>🎬 Ruffle SWF Player</h1>
    <p>Select your <strong>SWF</strong> file:</p>
    <input type="file" id="swf-file" accept=".swf">
    
    <div id="player-container">
        <div class="play-button" id="play-button">▶</div>
    </div>

    <!-- Include Ruffle script -->
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
    <script>
        document.getElementById('swf-file').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (!file) return;

            // Create a local blob URL for the chosen file
            const fileURL = URL.createObjectURL(file);

            const container = document.getElementById('player-container');
            const playButton = document.getElementById('play-button');
            
            // Hide play button and show loading icon
            playButton.style.display = 'none';
            container.innerHTML = '<div class="loading-container"><img src="icon.jpg" alt="Loading..." class="loading-icon"><div class="loading-text">Loading SWF...</div></div>';

            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            
            player.style.width = '100%';
            player.style.height = '100%';

            // Load the local blob URL into Ruffle
            player.load({
                url: fileURL,
                backgroundColor: '#000',
                autoplay: 'on'
            });

            // Replace loading spinner with player once ready
            player.onEvent('runtime', (e) => {
                container.innerHTML = '';
                container.appendChild(player);
            });
        });
    </script>
</body>
</html>
