<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Filly</title>
    <style>
        body { font-family: Arial, sans-serif; background: #222; color: #fff; text-align: center; margin: 0; padding: 20px; }
        #player-container { width: 800px; height: 600px; margin: 20px auto; background: #000; border: 2px solid #444; position: relative; }
        input, button { padding: 10px; margin: 5px; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>

    <h1>Filly</h1>
    <input type="file" id="upload" accept=".swf">
    <button id="fullscreen-btn">Fullscreen</button>

    <div id="player-container"></div>

    <!-- Load Ruffle Player Script -->
    <script src="https://unpkg.com"></script>
    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        let player;

        window.addEventListener("DOMContentLoaded", () => {
            const ruffle = window.RufflePlayer.newest();
            const container = document.getElementById("player-container");
            
            player = ruffle.createPlayer();
            container.appendChild(player);

            // Handle file upload
            document.getElementById("upload").addEventListener("change", (event) => {
                const file = event.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        player.load({
                            data: e.target.result,
                            // Enables local data saving support inside Ruffle
                            allowScriptAccess: true
                        });
                    };
                    reader.readAsArrayBuffer(file);
                }
            });

            // Handle Fullscreen
            document.getElementById("fullscreen-btn").addEventListener("click", () => {
                if (player) {
                    player.enterFullscreen();
                }
            });
        });
    </script>
</body>
</html>
